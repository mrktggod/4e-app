name: Nightly Playwright

on:
  schedule:
    - cron: '17 23 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-playwright-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: web-telegram-vk
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright suite
        run: npm run test:e2e

      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-nightly-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            autotests/playwright-report/
            autotests/test-results/
          if-no-files-found: ignore
          retention-days: 14
